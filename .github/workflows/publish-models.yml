name: Publish denoise model

# Builds nafnet_denoise.onnx from the MIT-licensed NAFNet-SIDD-width32
# weights and attaches it to the "models-nafnet-v1" pre-release, which is the
# download URL in models/manifest.json. The asset is never replaced once it
# exists, so the manifest's sha256 stays valid. Pre-releases are excluded from
# /releases/latest, so the app's update check is unaffected.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-models.yml"
      - "scripts/models/export_nafnet_onnx.py"
      - "scripts/models/nafnet_arch.py"

permissions:
  contents: write

env:
  TAG: models-nafnet-v1
  ASSET: nafnet_denoise.onnx

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Skip if the asset is already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$ASSET already on $TAG; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python 3.11
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install export tools
        if: steps.check.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy<2" "onnx==1.16.2" "onnxruntime==1.19.2"
      - name: Export and parity-check NAFNet
        if: steps.check.outputs.exists == 'false'
        working-directory: scripts/models
        run: python export_nafnet_onnx.py --out "$RUNNER_TEMP/$ASSET"
      - name: Publish pre-release asset
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          sha256sum "$ASSET" | tee "$ASSET.sha256"
          stat -c 'size_bytes %s' "$ASSET"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Model: NAFNet denoise v1" \
              --notes "NAFNet-SIDD-width32 exported to ONNX (opset 17, dynamic H/W, RGB [0,1] NCHW) by scripts/models/export_nafnet_onnx.py. Weights: megvii-research/NAFNet, MIT License. Downloaded on first use by retouch; not an app release."
          fi
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo "$GITHUB_REPOSITORY"
