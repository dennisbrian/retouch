name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgles2 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.21
          uv sync --locked --extra dev

      - name: Download model files
        run: |
          mkdir -p models
          curl --fail --location --retry 3 --silent --show-error \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task?generation=1683136941916318' \
            --output models/face_landmarker.task
          curl --fail --location --retry 3 --silent --show-error \
            'https://storage.googleapis.com/download/storage/v1/b/mediapipe-models/o/image_segmenter%2Fselfie_segmenter%2Ffloat16%2Flatest%2Fselfie_segmenter.tflite?alt=media&generation=1683436453600523' \
            --output models/selfie_segmenter.tflite
          curl --fail --location --retry 3 --silent --show-error \
            'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task?generation=1682642785209422' \
            --output models/pose_landmarker_full.task
          python scripts/qa/verify_models.py \
            --model face_landmarker \
            --model selfie_segmenter \
            --model pose_landmarker_full

      - name: Unit and integration tests
        run: |
          uv run --locked python -m pytest tests/ -v --tb=short -x --ignore=tests/test_cli.py

      - name: CLI tests
        run: |
          uv run --locked python -m pytest tests/test_cli.py -v --tb=short -x

  wheel-smoke:
    name: Wheel package-data smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip build==1.3.0
          python -m build --wheel --outdir dist
          python -m venv wheel-smoke-venv
          wheel-smoke-venv/bin/python -m pip install --no-deps dist/*.whl
      - name: Verify installed package resources
        run: |
          wheel-smoke-venv/bin/python -c '
          from importlib import resources
          import json
          manifest = json.loads(resources.files("models").joinpath("manifest.json").read_text())
          assert "pose_landmarker_full" in manifest["models"]
          assert resources.files("presets").joinpath("natural.json").is_file()
          print("wheel package data verified")
          '
      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retouch-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Attest wheel provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
