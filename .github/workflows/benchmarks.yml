name: Benchmarks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Pipeline benchmarks (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgles2 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run benchmarks
        run: |
          python scripts/bench/benchmark.py --output benchmark_results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          if-no-files-found: warn
          retention-days: 90

      - name: Print benchmark summary
        if: always()
        run: |
          if [ -f benchmark_results.json ]; then
            echo "## Benchmark summary" >> "$GITHUB_STEP_SUMMARY"
            python -c "
          import json, sys
          try:
              with open('benchmark_results.json') as f:
                  data = json.load(f)
              bench = data.get('benchmarks', data) if isinstance(data, dict) else data
              if isinstance(bench, list):
                  for b in bench[:20]:
                      name = b.get('name') or b.get('full_id') or b.get('id', '?')
                      ms = b.get('mean_ms') or b.get('stats', {}).get('mean', 0)
                      p95 = b.get('p95_ms') or b.get('stats', {}).get('p95', 0)
                      print(f\"| {name} | {ms:.2f} ms | {p95:.2f} ms |\")
          except Exception as exc:
              print(f'(could not parse results: {exc})', file=sys.stderr)
          "
          fi
