name: Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"  # nightly full audit
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  fast-checks:
    name: Governance fast checks (ERRORs only)
    runs-on: ubuntu-latest
    # ERROR-level only: broken doc links, architecture drift on required
    # modules, global-python commands in onboarding docs. Skips test
    # collection so PR feedback stays under a minute.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run governance --ci
        run: python scripts/dev/governance.py --ci

  pr-risk:
    name: PR risk classification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Classify risk + post summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summary="$(python3 scripts/dev/pr_governor.py risk "origin/${{ github.base_ref }}" HEAD --offline --pr ${{ github.event.pull_request.number }})"
          echo "$summary"
          {
            echo "### PR risk classification"
            echo '```'
            echo "$summary"
            echo '```'
            echo "Overlap across open PRs:"
            python3 scripts/dev/pr_governor.py overlap || true
          } >> "$GITHUB_STEP_SUMMARY"
      # Classification is advisory: HIGH never auto-merges, but no merge
      # automation exists yet — the label gates future auto-merge, not humans.

  post-merge-smoke:
    name: Post-merge smoke validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.21
          uv sync --locked --extra dev

      - name: Post-merge smoke (governance + golden/recipe tests + stats deltas)
        run: uv run --locked python scripts/dev/pr_governor.py post-merge

  full-audit:
    name: Governance full audit (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install locked environment (for test collection)
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.21
          uv sync --locked --extra dev

      - name: Full audit with --strict
        run: uv run --locked python scripts/dev/governance.py --strict

      - name: REPO_STATS.md is fresh
        run: |
          uv run --locked python scripts/dev/governance.py --write-stats
          if ! git diff --quiet docs/REPO_STATS.md; then
            echo "::error::docs/REPO_STATS.md is stale; run: scripts/dev/governance --write-stats"
            git diff docs/REPO_STATS.md
            exit 1
          fi
