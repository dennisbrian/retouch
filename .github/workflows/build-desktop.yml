name: Desktop builds

# Unsigned standalone builds for macOS, Windows and Linux, each launched once
# to prove the frozen app starts. Signed macOS releases stay in
# release-macos.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build/**"
      - "desktop.py"
      - "gui*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            binary: "dist/Pro Max Retouch Studio.app/Contents/MacOS/Pro Max Retouch Studio"
            artifact: retouch-macos
          - os: windows-latest
            binary: "dist/Pro Max Retouch Studio/Pro Max Retouch Studio.exe"
            artifact: retouch-windows
          - os: ubuntu-latest
            binary: "dist/Pro Max Retouch Studio/Pro Max Retouch Studio"
            artifact: retouch-linux
    env:
      RETOUCH_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libglib2.0-0 libnss3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-render-util0 libxcb-image0 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6

      - name: Install locked desktop environment
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.21
          uv sync --locked --extra desktop

      - name: Install pywebview Qt backend (Linux)
        if: runner.os == 'Linux'
        # pywebview has no bundled Linux backend; Qt WebEngine is the one
        # that installs from wheels without system GTK introspection.
        run: uv pip install PyQt6 PyQt6-WebEngine qtpy

      - name: Build standalone app
        shell: bash
        run: uv run --no-sync pyinstaller --clean --noconfirm scripts/build/retouch_app.spec

      - name: Launch smoke test
        shell: bash
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "${{ matrix.binary }}" > app.log 2>&1 &
          else
            "${{ matrix.binary }}" > app.log 2>&1 &
          fi
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:7860/; then
              echo "Frozen app is serving"
              exit 0
            fi
            sleep 3
          done
          echo "Frozen app did not start"
          cat app.log
          exit 1

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
