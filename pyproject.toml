[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "retouch-engine"
version = "0.1.0"
description = "Professional automated face retouching engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=6.0.0",
]
gui = [
    "gradio>=4.0.0",
    "pywebview>=5.0.0",
    "pyinstaller>=6.0.0",
]
raw = ["rawpy>=0.19.0"]

[tool.setuptools.packages.find]
include = ["retouch*"]
