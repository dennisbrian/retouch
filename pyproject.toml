[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retouch-engine"
version = "2.0.0"
description = "Professional automated face retouching engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.9"
dependencies = [
    "opencv-contrib-python>=4.8.0,<4.12",
    # 0.10.5 is the last tested macOS legacy CPU graph for this project.
    "mediapipe==0.10.5",
    "protobuf>=3.20,<4",
    "numpy>=1.24.0,<2",
    # 1.19.2 is the last tested release with wheels for every supported
    # CPython 3.9-3.11 CI target, including Linux and macOS.
    "onnxruntime==1.19.2",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
    "jsonschema>=4.18.0,<5",
]

[project.optional-dependencies]
dev = [
    "gradio>=4.0.0,<5",
    "huggingface-hub>=0.19.3,<1",
    # Starlette 1.0 removed the TemplateResponse(name, context) form Gradio 4 uses;
    # every page load then fails with "unhashable type: 'dict'".
    "starlette<1",
    "pytest>=7.0.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0,<3",
    # Exercises the optional Content Credentials signing path in tests.
    "c2pa-python>=0.37,<0.38; python_version >= '3.10'",
    # Exercises retouch.video (streaming media I/O) in tests.
    "av>=15,<16",
]
# Optional: sign retouched photos with Content Credentials (C2PA) using your
# own certificate (cli.py --sign-cert/--sign-key).
credentials = [
    "c2pa-python>=0.37,<0.38; python_version >= '3.10'",
]
gui = [
    "gradio>=4.0.0,<5",
    "huggingface-hub>=0.19.3,<1",
    # Starlette 1.0 removed the TemplateResponse(name, context) form Gradio 4 uses;
    # every page load then fails with "unhashable type: 'dict'".
    "starlette<1",
]
desktop = [
    "gradio>=4.0.0,<5",
    "huggingface-hub>=0.19.3,<1",
    # Starlette 1.0 removed the TemplateResponse(name, context) form Gradio 4 uses;
    # every page load then fails with "unhashable type: 'dict'".
    "starlette<1",
    "pywebview>=5.0.0,<7",
    "pyinstaller>=6.0.0,<7",
    "pyobjc-core<12; sys_platform == 'darwin' and python_version < '3.10'",
    "pyobjc-framework-Cocoa<12; sys_platform == 'darwin' and python_version < '3.10'",
    "pyobjc-framework-Quartz<12; sys_platform == 'darwin' and python_version < '3.10'",
    "pyobjc-framework-Security<12; sys_platform == 'darwin' and python_version < '3.10'",
    "pyobjc-framework-UniformTypeIdentifiers<12; sys_platform == 'darwin' and python_version < '3.10'",
    "pyobjc-framework-WebKit<12; sys_platform == 'darwin' and python_version < '3.10'",
]
raw = ["rawpy>=0.19.0"]
# Optional: video retouch (retouch.video). PyAV bundles its own FFmpeg, H.264 included.
video = ["av>=15,<16"]
capture = ["lensfunpy>=1.6.0"]

[tool.setuptools.packages.find]
include = ["retouch*", "models", "presets", "luts"]

[tool.setuptools.package-data]
models = ["manifest.json"]
presets = ["*.json"]
luts = ["*.cube", "ACQUISITION.md"]
"retouch.editor" = ["static/*.html", "static/*.js"]

[tool.pytest.ini_options]
timeout = 120
timeout_method = "thread"
markers = [
    "slow: long-running regression or golden-image test",
    "native: initializes native MediaPipe or accelerator resources",
]
