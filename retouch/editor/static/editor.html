<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layer Editor</title>
<style>
:root {
  --bg: #f4f4f5; --panel: #ffffff; --text: #18181b; --muted: #71717a;
  --line: #d4d4d8; --accent: #ea580c; --accent-text: #ffffff; --select: #ffedd5;
  --danger: #b91c1c; --canvas: #e4e4e7; --check-a: #ffffff; --check-b: #d4d4d8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18181b; --panel: #27272a; --text: #f4f4f5; --muted: #a1a1aa;
    --line: #3f3f46; --accent: #f97316; --accent-text: #18181b; --select: #431407;
    --danger: #f87171; --canvas: #111113; --check-a: #3f3f46; --check-b: #27272a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 10px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.on { background: var(--select); border-color: var(--accent); }
input[type=text] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 8px; min-width: 0; }
input[type=range] { accent-color: var(--accent); }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
.bar .grow { flex: 1 1 220px; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
label.inline { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
label.inline span.value { color: var(--text); min-width: 2.6em; text-align: right; }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; overflow: hidden; background: var(--canvas); touch-action: none; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--muted); text-align: center; padding: 24px; }
#busy { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; display: none; }
aside { width: 280px; flex: none; border-left: 1px solid var(--line); background: var(--panel);
  display: flex; flex-direction: column; min-height: 0; }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  margin: 10px 10px 6px; }
#layers { list-style: none; margin: 0; padding: 0 6px; overflow-y: auto; flex: 1; }
#layers li { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px;
  border: 1px solid transparent; cursor: pointer; }
#layers li.selected { background: var(--select); border-color: var(--accent); }
#layers li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#layers li .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 4px; }
#layers li .tag.off { text-decoration: line-through; }
.panel { padding: 8px 10px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.panel .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#status { padding: 4px 10px; border-top: 1px solid var(--line); background: var(--panel);
  color: var(--muted); min-height: 24px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status.error { color: var(--danger); }
@media (max-width: 720px) {
  main { flex-direction: column; }
  aside { width: auto; height: 42%; border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="bar">
  <input id="path" class="grow" type="text" spellcheck="false"
         placeholder="Full path of a photo or .comp project, e.g. ~/Pictures/DSCF3503.jpg">
  <button id="open" class="primary" title="Open the photo or project at this path">Open</button>
  <button id="addLayer" title="Add the photo at this path as a new layer">Add as layer</button>
  <button id="upload" title="Pick a photo to open">Upload photo…</button>
  <button id="uploadLayer" title="Pick a photo to add as a new layer">Upload layer…</button>
  <input id="file" type="file" accept="image/*" hidden>
  <span class="sep"></span>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  <span class="sep"></span>
  <button id="save" title="Save the project (Ctrl+S)">Save</button>
  <button id="saveAs" title="Save the project as a .comp at the path in the box">Save as</button>
  <button id="export" title="Flatten at full resolution to a PNG at the path in the box">Export PNG</button>
</div>
<div class="bar">
  <button id="toolHide" class="on" title="Brush that hides the selected layer (E)">Hide brush</button>
  <button id="toolReveal" title="Brush that brings hidden parts back (B)">Reveal brush</button>
  <button id="toolPan" title="Drag to move around; hold Space with any tool (H)">Hand</button>
  <label class="inline">Size <input id="size" type="range" min="1" max="2000" value="120"><span class="value" id="sizeV"></span></label>
  <label class="inline">Hardness <input id="hardness" type="range" min="0" max="100" value="50"><span class="value" id="hardnessV"></span></label>
  <label class="inline">Opacity <input id="brushOpacity" type="range" min="1" max="100" value="100"><span class="value" id="brushOpacityV"></span></label>
  <label class="inline"><input id="showMask" type="checkbox"> Show mask</label>
  <span class="sep"></span>
  <button id="zoomOut" title="Zoom out (-)">−</button>
  <span id="zoomV" style="min-width:3.5em;text-align:center">100%</span>
  <button id="zoomIn" title="Zoom in (+)">+</button>
  <button id="fit" title="Fit to window (0)">Fit</button>
  <button id="actual" title="Actual pixels (1)">100%</button>
</div>
<main>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="empty">Type the full path of a photo or a .comp project above and press Open,<br>
      or upload a photo. Brush on a layer to hide or reveal parts of it.</div>
    <div id="busy">Working…</div>
  </div>
  <aside>
    <h2>Layers</h2>
    <ul id="layers"></ul>
    <div class="panel">
      <label class="inline">Opacity <input id="layerOpacity" type="range" min="0" max="100" value="100" style="flex:1"><span class="value" id="layerOpacityV"></span></label>
      <div class="row">
        <button id="up" title="Move the layer up">Up</button>
        <button id="down" title="Move the layer down">Down</button>
        <button id="rename">Rename</button>
        <button id="remove" title="Delete the layer">Delete</button>
      </div>
      <div class="row">
        <button id="maskAdd" title="Add a mask that shows the whole layer">Add mask</button>
        <button id="maskHideAll" title="Add a mask that hides the whole layer">Hide all</button>
        <button id="maskToggle" title="Turn the mask off or on">Mask off</button>
        <button id="maskRemove" title="Delete the mask">Delete mask</button>
      </div>
    </div>
  </aside>
</main>
<div id="status"></div>
<script>
window.EDITOR_TOKEN = "__EDITOR_TOKEN__";
/*EDITOR_SCRIPT*/
</script>
</body>
</html>
